<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Shopify Admin Dark Mode</h1>

    <label class="switch-row" for="toggle">
      <span>Dark mode</span>
      <span class="switch">
        <input id="toggle" type="checkbox" />
        <span class="track" aria-hidden="true"></span>
      </span>
    </label>

    <label class="switch-row" for="showButton">
      <span>Show toggle in Shopify</span>
      <span class="switch">
        <input id="showButton" type="checkbox" />
        <span class="track" aria-hidden="true"></span>
      </span>
    </label>

    <p class="hint">
      Both apply to open admin tabs right away. With the in-page toggle off,
      this popup is the only switch.
    </p>

    <a class="repo" href="https://github.com/pillgat3s/shopify-admin-dark-mode"
       target="_blank" rel="noreferrer">
      <span>View on GitHub</span>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>

    <a class="repo donate" href="https://pillgates.dev/shopify-dark-mode"
       target="_blank" rel="noreferrer">
      <span>Donate</span>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>

    <p class="hint">
      Updates are published as releases on GitHub.
    </p>

    <p class="version">Version <span id="version">—</span></p>

    <script src="popup.js"></script>
  </body>
</html>
